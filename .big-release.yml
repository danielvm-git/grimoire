branches:
  - name: main
tagFormat: "v${version}"
initialVersion: "0.11.6"

plugins:
  - changelog
  - git
  - github

# Keep the changelog focused on user-visible changes.
commitTypes:
  - type: feat
    section: Features
  - type: fix
    section: Bug Fixes
  - type: perf
    section: Performance
  - type: revert
    section: Reverts
  - type: docs
    hidden: true
  - type: chore
    hidden: true
  - type: refactor
    hidden: true

# Optional publishers — enable once the registry token is configured:
# publishers:
#   pypi:
#     enabled: true
