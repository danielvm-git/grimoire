- e04
source: change-request from test suite review session
stories:
- id: e09s01
  title: 'ci-green: default-branch CI health check'
  status: done
  bcps: 1
  description: "Check that the latest CI run on the default branch is passing. Targets\n\
    only repos with `.github/workflows/` via script targeting. Uses `gh run list`\n\
    to find failed runs. Severity: error \u2014 CI failures should block forward work.\n"
  verify:
  - test -f data/checks/ci-green.yaml
  - python -c "from grimoire.checks.loader import load_checks; checks=[c.slug for
    c in load_checks('data')]; assert 'ci-green' in checks"
  spec: e09s01-ci-green-default-branch-ci-health-c.md
  tasks: e09s01-tasks.yaml
