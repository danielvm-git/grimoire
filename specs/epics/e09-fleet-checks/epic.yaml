- id: e09s05
  title: 'lint-passes: language-aware linter check'
  status: done
  bcps: 2
  description: "One check that auto-detects the project language and runs the appropriate\n\
    linter. Script targeting via file-existence gates: pyproject.toml \u2192 ruff,\n\
    go.mod \u2192 golangci-lint, package.json \u2192 eslint, Cargo.toml \u2192 cargo\
    \ clippy,\nPackage.swift \u2192 swiftlint. Falls back to shellcheck for shell\
    \ scripts.\nSeverity: warning \u2014 lint is important but shouldn't block the\
    \ dashboard.\n"
  verify:
  - test -f data/checks/lint-passes.yaml
  - grep -qE 'ruff|golangci-lint|eslint|cargo clippy|swiftlint|shellcheck' data/checks/lint-passes.yaml
  spec: e09s05-lint-passes-language-aware-linter-c.md
  tasks: e09s05-tasks.yaml
