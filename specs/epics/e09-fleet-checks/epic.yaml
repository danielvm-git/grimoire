- id: e09s08
  title: 'ci-cd-migration: v3 workflow pair status check'
  status: done
  bcps: 1
  description: "Dedicated slim check (does NOT modify ci-cd-pipeline-audit.yaml) that\n\
    reports whether repos have migrated to the v3 CI/CD pair:\n  PASS \u2014 test-build-release.yml\
    \ + separate deploy.yml/deploy-*.yml\n        (workflow_run trigger; deploy concurrency\
    \ not cancel-in-progress)\n  FAIL \u2014 primary still ci-cd-*.yml, or only embedded\
    \ deploy in one file\n  WARN \u2014 no recognizable workflows\nCloses the visibility\
    \ gap called out in issue #2 (detection rewritten for\nv3; issue body\u2019s \u201C\
    ci-cd-*.yml is new\u201D logic is stale and must not be used).\nSeverity: warning.\
    \ Targets: default branch of all tracked repos.\n"
  verify:
  - test -f data/checks/ci-cd-migration.yaml
  - python -c "from grimoire.checks.loader import load_checks; checks=[c.slug for
    c in load_checks('data')]; assert 'ci-cd-migration' in checks"
  - grep -q 'test-build-release' data/checks/ci-cd-migration.yaml
  - 'grep -q ''severity: warning'' data/checks/ci-cd-migration.yaml'
  spec: e09s08-ci-cd-migration-v3-workflow-pair-st.md
  tasks: e09s08-tasks.yaml
