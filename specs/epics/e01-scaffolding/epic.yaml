- id: e01s02
  title: YAML configuration schema with Pydantic v2 validation
  status: done
  bcps: 5
  description: Parse config.yaml with Pydantic v2. Support ${ENV_VAR} resolution via
    regex. Define GitHubConfig, GitConfig, SigningConfig, WorkflowFilter, StaticRepoSource,
    TeamRepoSource, StalenessConfig, BacklogConfig models. Support XDG config paths
    via dataconfy.
  verify:
  - python -c 'from grimoire.config import load_config; c=load_config()'  (with valid
    config.yaml)
  - python -c 'from grimoire.config import resolve_env_vars; assert resolve_env_vars("\${TEST}")
    == "value"'  (with TEST=value)
  spec: e01s02-yaml-configuration-schema-with-pyda.md
  tasks: e01s02-tasks.yaml
