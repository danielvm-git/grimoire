    with HX-Trigger:checkRunCompleted/actionRunCompleted. Action run detail expansion,
    action output viewing, check output viewing, check results expansion. Backlog
    items filtered partial.
  verify:
  - grep -c 'partials/' src/grimoire/web/router.py | grep -v ':0$'
  spec: e06s08-htmx-partials-for-real-time-updates.md
  tasks: e06s08-tasks.yaml
