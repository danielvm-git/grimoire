source: docs/specs/06-web-application.md
stories:
- id: e06s01
  title: FastAPI app factory and router wiring
  status: done
  bcps: 4
  description: "create_app() mounts all API routers (repos, checks, actions), web\
    \ router, static files, health endpoint. lifespan() orchestrates config load,\
    \ DB setup, workspace setup, check/action loading, scheduler registration, background\
    \ refresh. Three-tier data freshness: serve cached DB \u2192 background refresh\
    \ if stale \u2192 loading page if empty."
  verify:
  - python -c 'from grimoire.app import create_app; app=create_app(); assert app.title=="Grimoire"'
  spec: e06s01-fastapi-app-factory-and-router-wiri.md
  tasks: e06s01-tasks.yaml
- id: e06s02
  title: Loading page with progress polling
  status: done
  bcps: 2
  description: GET / renders loading.html when no cache + refresh running. DaisyUI
    progress bar. HTMX polls GET /partials/loading-status every 2s. HX-Redirect to
    / on completion. Non-blocking startup via asyncio.create_task().
  verify:
  - grep -q 'loading.html' src/grimoire/web/router.py
  spec: e06s02-loading-page-with-progress-polling.md
  tasks: e06s02-tasks.yaml
- id: e06s03
  title: Dashboard page with sortable repo matrix
  status: done
  bcps: 5
  description: 'GET / renders dashboard.html with RepoViewModel list. Sortable by
    name, health, issues, PRs, branches, workflow_failures, check_failures, last_activity.
    Three-tier health: error (red), warning (yellow), ok (green). Aggregate stats
    bar. Global warnings. Refresh button with HTMX polling.'
  verify:
  - grep -q 'dashboard.html' src/grimoire/web/router.py
  spec: e06s03-dashboard-page-with-sortable-repo-m.md
  tasks: e06s03-tasks.yaml
- id: e06s04
  title: Repository detail page
  status: done
  bcps: 3
  description: GET /repo/{owner}/{name} renders repository.html. Per-branch workflow
