  verify:
  - grep -q 'repository.html' src/grimoire/web/router.py
  spec: e06s04-repository-detail-page.md
  tasks: e06s04-tasks.yaml
- id: e06s05
  title: Actions management page
  status: done
  bcps: 4
  description: GET /actions renders actions.html with ActionViewModel list. Per-action
