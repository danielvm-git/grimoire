  verify:
  - grep -q 'actions.html' src/grimoire/web/router.py
  spec: e06s05-actions-management-page.md
  tasks: e06s05-tasks.yaml
- id: e06s06
  title: Checks management page
  status: done
  bcps: 4
  description: GET /checks renders checks.html with CheckViewModel list. Per-check
    stats (pass/fail/warn/last_run). Severity-aware display (error vs warning). Inline
    results expansion via HTMX grouped by run. Individual result output viewing. Run
    button with progress polling.
  verify:
  - grep -q 'checks.html' src/grimoire/web/router.py
  spec: e06s06-checks-management-page.md
  tasks: e06s06-tasks.yaml
- id: e06s07
  title: Backlog page with weighted scoring
  status: done
  bcps: 6
  description: "GET /backlog renders prioritized problem list. WSJF-inspired scoring:\
    \ category base weights \xD7 repository multipliers \xD7 workflow weights. Five\
    \ categories (failing_workflow, failing_check_error, failing_check_warning, stale_pr,\
    \ stale_issue). Four priority tiers (critical/high/medium/low). Filter by category,\
    \ repo, min_score, search. Group by repo or type. Markdown export. Configurable\
    \ weights save-back to config.yaml."
  verify:
  - grep -q 'backlog.html' src/grimoire/web/router.py
  - python -c 'from grimoire.web.backlog import build_backlog_items, BacklogItem,
    BacklogCategory'
  spec: e06s07-backlog-page-with-weighted-scoring.md
  tasks: e06s07-tasks.yaml
- id: e06s08
  title: HTMX partials for real-time updates
  status: done
  bcps: 3
  description: Dashboard matrix/list partials for sort-switching. Refresh button status
