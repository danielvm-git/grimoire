# Session 2026-11-09 — three user-reported defects fixed and shipped
decisions_latest:
  - gate: bug-dot-segment-repo-url
    decision: "Fixed the reported /repo/danielvm-git/.github 404 with a query-form URL shape (repo_url() + /repo?name=...), not a routing change, because the edge proxy rejects dot-prefixed path segments before the app sees the request. PR #70 (82dbe60); live check: the dashboard links /repo?name=danielvm-git/.github and that URL returns 200 with the repo page."
    reason: "Root cause was provably outside the app (19-byte Go 404), so only the emitted URL could change."
  - gate: bug-static-repo-list-drift
    decision: "Replaced the 66-entry static list with a dynamic user: source after measuring 66 configured - 13 deleted = 53 tracked against 58 owned. PR #71 (850000e); resolve_repositories against the real account returned exactly 58, and live /health now reports tracked_repos: 58 with zero dashboard warnings."
    reason: "The user asked for dynamic discovery; a static list drifts in both directions and silently wastes a 404 call per deleted repo per refresh."
  - gate: bug-checks-wait-for-cron
    decision: "Added run_all_checks_once() and wired it into startup after the initial refresh, with checks.run_on_startup to opt out. PR #73 (c16bce9); a smoke run showed a cron-scheduled and a schedule-less check each running once at boot, and the live deployment produced real check results within ~90 s of the redeploy."
    reason: "The user asked for all checks to run at deploy time and then follow the schedule; the startup refresh skips the schedule-less pass so nothing runs twice."
  - gate: gate-integrity
    decision: "Every fix shipped failing-tests-first (8 + 10 + 6 new tests), green preflight (736 -> 752 passing) and green main CI; no gate, test or workflow was weakened."
    reason: "Always Green and shift-left rules from CONVENTIONS.md."

# Build&Ship cycle — 2026-11-08 (SCOPE: all pending work)
decisions:
  - gate: phase-1-triage-baseline
    decision: "Recorded baseline: clean tree at 5e6a2dc, no uncommitted work, no failing tests (559 passed), registry 65/65 fixed, no active bug entry. Work items = the unmerged conformance branch only."
    reason: "Phase 1 asks for failing tests and active registry entries as work items; both lists were empty, so pending work came from unmerged branches."
  - gate: phase-1-stale-branch-triage
    decision: "Used git cherry plus tree comparison to classify branches. feat/repo-checks-run, chore/e13s05-release-record and danielvm-git/musing-villani-96c3f5 had zero unapplied commits (musing-villani had zero diff vs main) and were deleted as merged. danielvm-git/open-specs-findings-11d1df was the only branch with an unapplied commit (4f0b215), renamed feat/conformance-score and shipped."
    reason: "Squash merges break patch-id checks, so content comparison was needed before declaring a branch merged. Nothing unmerged was deleted."
  - gate: phase-2-conformance-interpreter-gap
    decision: "Blocked the merge until the bundled conformance checks stopped calling bare python3: run.sh starts uvicorn without the venv on PATH, so all 15 checks raised ModuleNotFoundError and every repo would show 0% compliance and a red P0. Fixed with GRIMOIRE_PYTHON from target_env (commit 414e280) using failing tests first."
    reason: "Verify-work gap closure: the feature would have been broken in the documented production runtime."
  - gate: phase-2-spec-tracking-gap
    decision: "Added docs/specs/09-conformance-rules.md with git add -f because specs/ in .git/info/exclude also matches docs/specs/, leaving the module spec untracked (commit d04e48e)."
    reason: "AGENTS.md requires a numbered spec for a new module; the file existed but was invisible to git."
  - gate: phase-3-verify-work
    decision: "just check (644 passed), just coverage (89% total, conformance 93-100%), just build (sdist+wheel), pyright strict green. scripts/trace-stories and scripts/sync-skills do not exist in this repo, so traceability was satisfied by spec 09 plus the 00-overview module graph and user docs."
    reason: "Substituted the gates that exist for the ones the skill assumes; no gate was skipped."
  - gate: phase-4-release-branch
    decision: "Shipped PR #61 with one small conventional commit per fix, merged squash-merge after test+build green, verified main CI green afterwards (Test Build Release, Test Build Release Docs, Deploy, Deploy Docs), pulled main and removed the merged worktree and both local and remote branches."
    reason: "workflow_mode is solo-git, but CONVENTIONS.md forbids pushing to main directly, so the PR path is the intersection of both policies."
  - gate: phase-4-auto-release
    decision: "The repository release workflow auto-tagged v0.15.0 from the merged feat commit. No manual tag or publish was performed in this run."
    reason: "Semantic release is triggered by the repo's own main pipeline, not by an agent action."

