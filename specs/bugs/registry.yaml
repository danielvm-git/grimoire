  - slug: github-service-improper-delete-exec
    title: Using session.exec() instead of session.execute() for delete() DML statements
    module: src/grimoire/github/service.py
    severity: low
    status: fixed
    description: >
      delete() queries in save_stats_to_db and _prune_repos_from_db use session.exec(delete(...)) suppressed with type ignores.
    reproduction_steps:
