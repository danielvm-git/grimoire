    reproduction_steps:
      - Start Grimoire without checks configured.
      - POST to /partials/check-run/{slug}.
      - 500 AssertionError.
    root_cause_hypothesis: >
      assert used instead of HTTPException for user-facing error responses.

  - slug: checks-background-task-no-error-handler
    title: Checks router background task has no exception handler unlike actions router
    module: src/grimoire/checks/router.py
    severity: medium
    status: fixed
    description: >
      The checks router background task has no try/except, unlike the actions router which catches
      ActionConflictError. Unhandled exceptions in background tasks are silently swallowed by FastAPI.
    reproduction_steps:
      - Trigger a check that raises an exception in the background task.
      - Observe no error is logged or surfaced.
    root_cause_hypothesis: >
      Missing try/except in _run_in_background closure.

  - slug: datetime-now-naive-in-actions-router
    title: datetime.now() without timezone in actions router response
    module: src/grimoire/actions/router.py
    severity: low
    status: fixed
    description: >
