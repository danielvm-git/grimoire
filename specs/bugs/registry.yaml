    reproduction_steps:
      - Start Grimoire with an empty repository configuration.
      - Navigate to / in browser.
      - Inspect browser console for TypeError.
    root_cause_hypothesis: >
      The #repo-grid container element is conditionally excluded from the DOM when repos is empty instead of always existing as an outer swap target.

  - slug: backlog-save-weights-config-corruption
    title: /api/backlog/save-weights endpoint lacks input payload validation, risking permanent config.yaml corruption
    module: src/grimoire/web/router.py
    severity: high
    status: fixed
    description: >
      The endpoint POST /api/backlog/save-weights accepts arbitrary JSON from request.json() and directly writes it to config.yaml via yaml.dump()
      before invoking Pydantic validation. If an invalid payload is sent, yaml.dump overwrites config.yaml with invalid data before validation fails,
      permanently corrupting config.yaml on disk.
    reproduction_steps:
      - Send POST request to /api/backlog/save-weights with invalid payload.
      - Observe HTTP 500 error from Pydantic validation.
      - Inspect config.yaml to confirm corrupted data was written to disk.
    root_cause_hypothesis: >
      File write operation is performed prior to input validation rather than validating payload before disk write.
    files_changed:
      - src/grimoire/web/router.py
      - tests/test_web/test_router.py
    approach: >
      Payload is validated into BacklogConfig.model_validate() before any write and invalid input returns 400 with config untouched. Regression: test_save_weights_invalid_payload_returns_400, test_save_weights_writes_validated_model.
    risk_level: low
    commit_message: "fix(web): validate backlog weights payload before writing config"

  - slug: subprocess-memory-unbounded-buffer
    title: Unbounded stdout buffering in proc.communicate() causes memory spike before 64KB truncation
    module: src/grimoire/actions/engine.py
    severity: medium
    status: fixed
    description: >
      _execute_action and _execute_global_action await proc.communicate(), which buffers all
      subprocess stdout and stderr bytes into RAM. If a script outputs hundreds of megabytes of text,
      Python allocates memory for the full output before applying 64KB truncation.
    reproduction_steps:
      - Create an action script outputting MBs of text.
      - Trigger the action and observe high memory consumption prior to 64KB truncation.
    root_cause_hypothesis: >
      Subprocess output stream is read entirely into memory via proc.communicate() before capping is applied.
    files_changed:
      - src/grimoire/script.py
      - src/grimoire/actions/engine.py
      - src/grimoire/checks/engine.py
      - tests/test_script.py
    approach: >
      Rolling 64KB capped stream reader replaces proc.communicate(); both streams are drained concurrently and proc.wait() reaps the child. Regression: test_read_capped_large_output_truncated_to_tail, test_read_stdout_stderr_capped_reads_both_streams_concurrently.
    risk_level: low
    commit_message: "fix(engines): bound subprocess output to 64KB via capped stream reader (PR #22)"

  - slug: targeting-zombie-process-leak
    title: Zombie subprocess leak on script targeting timeout
    module: src/grimoire/targeting.py
    severity: medium
    status: fixed
    description: >
      When _script_matches times out after 30 seconds, proc.kill() is called to terminate the subprocess,
      but await proc.wait() is omitted, leaving zombie (defunct) processes in the OS process table.
    reproduction_steps:
      - Configure an action with a script target that runs sleep 60.
      - Execute resolve_targets and wait 30 seconds for timeout.
      - Inspect process table for defunct processes.
    root_cause_hypothesis: >
      _script_matches exception handler calls proc.kill() without awaiting proc.wait().

