# Grimoire Bug Registry

bugs:
  - slug: action-stale-running-lockout
    title: Stale "running" DB status causes permanent action execution deadlock after restart
    module: src/grimoire/actions/engine.py
    severity: high
    status: open
    description: >
      If the application crashes or restarts while an action is executing, its ActionRunRecord
      remains in status "running" in the SQLite database. Upon restart, is_action_running returns
      False because in-memory tracking is empty. However, when run_action executes in a background
      task, it queries the database for any record with status "running" and raises ActionConflictError.
      The background task in router.py catches ActionConflictError and silently aborts, causing all
      subsequent manual or scheduled executions of the action to silently fail permanently.
    reproduction_steps:
      - Trigger an action containing a long-running script.
      - Restart or kill the Grimoire process while the action is running.
      - Send a POST /actions/{slug}/run request or wait for cron execution.
      - Observe that the action fails silently and never executes because of the stale DB record.
    root_cause_hypothesis: >
      run_action checks DB status "running" without verifying if an in-memory task is active,
      and application initialization does not recover or reset interrupted "running" records upon startup.

  - slug: workspace-sync-concurrency-race
    title: Unlocked repository sync races with active worktree execution and workdir reset
    module: src/grimoire/workspace/manager.py
    severity: high
    status: fixed
    description: >
      WorkspaceManager.sync_repo executes git fetch on the bare repository and git checkout,
      git reset --hard, and git clean -fdx on worktrees without acquiring _repo_lock.
      In addition, reset_workdir executes git reset and git clean outside the _repo_lock block.
      If sync_repo or concurrent reset_workdir invocations run while an action or check script
      is executing in the worktree, files in the worktree are mutated or cleaned mid-execution.
    reproduction_steps:
      - Trigger an action whose script executes for several seconds in a worktree.
      - Concurrently invoke sync_repo or sync_all on the target repository.
      - Observe git reset --hard mutating files in the active worktree while the action script is running.
    root_cause_hypothesis: >
      sync_repo and post-creation worktree reset operations in reset_workdir do not acquire
      self._repo_lock(repo.full_name).

  - slug: worktree-creation-failure-corruption
    title: Partial worktree creation leaves invalid directories and causes permanent failure
    module: src/grimoire/workspace/manager.py
    severity: high
    status: fixed
    description: >
      If _ensure_worktree fails during git worktree add (e.g. missing remote branch or disk/git error),
      WorkspaceError is caught and logged, but the directory workdir may exist on disk.
      _ensure_worktree returns without creating a valid worktree. On subsequent executions,
      workdir.exists() returns True, preventing retries of git worktree add. Subsequent operations
      fail with WorkspaceError or FileNotFoundError.
    reproduction_steps:
      - Create an empty directory at {workspace_dir}/{owner}/{repo}/{branch} manually or interrupt git worktree add.
      - Call reset_workdir(full_name, branch).
      - Observe that _ensure_worktree skips worktree creation because workdir.exists() is True, and checkout fails with "fatal: not a git repository".
    root_cause_hypothesis: >
      _ensure_worktree relies solely on directory existence (workdir.exists()) rather than checking for
      a valid git worktree structure (e.g., .git pointer file), and swallows creation errors without cleaning up incomplete directories.

  - slug: github-client-pagination-race-condition
    title: GitHubClient._last_next_link instance variable causes concurrent pagination state corruption
    module: src/grimoire/github/client.py
    severity: high
    status: fixed
    description: >
      GitHubClient stores pagination state (_last_next_link) as an instance variable on self.
      During concurrent operations (such as refresh_all_stats, which fetches up to 10 repositories concurrently
      via asyncio.gather), one coroutine executing _request() updates self._last_next_link.
      If another coroutine calls _request() concurrently before the first coroutine reads self._last_next_link in _paginated_get(),
      the first coroutine will fetch the next page URL belonging to a completely different repository or endpoint.
    reproduction_steps:
      - Configure two or more repositories with >100 items requiring pagination.
      - Call refresh_all_stats(), which executes concurrent requests using asyncio.gather with Semaphore(10).
      - Observe coroutines interleaving and overwriting self._last_next_link mid-pagination.
    root_cause_hypothesis: >
      _last_next_link is stored as mutable instance state (self._last_next_link) instead of being returned directly from _request or extracted locally within _paginated_get.

  - slug: time-ago-attribute-error-none-timestamp
    title: _time_ago helper raises AttributeError when formatting orphan check results with None timestamp
    module: src/grimoire/web/router.py & src/grimoire/web/templates/partials/check_results.html
    severity: high
    status: fixed
    description: >
      When rendering check results fallback for orphan check runs, started_at can be assigned None
      if timestamp in the database is NULL. partials/check_results.html calls {{ time_ago(run.started_at) }} unconditionally.
      _time_ago(None) attempts to access None.tzinfo, raising AttributeError and returning HTTP 500.
    reproduction_steps:
      - Populate check_result DB table with rows where timestamp = NULL and run_id = NULL.
      - Send GET request to /partials/check-results/<check-slug>.
      - Observe HTTP 500 response.
    root_cause_hypothesis: >
      check_results_partial does not guard when started_at is None, and _time_ago assumes its argument is always non-null.

  - slug: dashboard-empty-state-null-pointer
    title: dashboard.html JavaScript throws TypeError when no repos exist
    module: src/grimoire/web/templates/dashboard.html
    severity: high
    status: fixed
    description: >
      In dashboard.html, #repo-grid is rendered inside {% if repos %}. When repos is empty, #repo-grid is excluded from the DOM.
      However, DOMContentLoaded unconditionally executes document.getElementById('repo-grid').classList.remove('hidden'),
      throwing TypeError: Cannot read properties of null.
    reproduction_steps:
      - Start Grimoire with an empty repository configuration.
      - Navigate to / in browser.
      - Inspect browser console for TypeError.
    root_cause_hypothesis: >
      The #repo-grid container element is conditionally excluded from the DOM when repos is empty instead of always existing as an outer swap target.

  - slug: backlog-save-weights-config-corruption
    title: /api/backlog/save-weights endpoint lacks input payload validation, risking permanent config.yaml corruption
    module: src/grimoire/web/router.py
    severity: high
    status: open
    description: >
      The endpoint POST /api/backlog/save-weights accepts arbitrary JSON from request.json() and directly writes it to config.yaml via yaml.dump()
      before invoking Pydantic validation. If an invalid payload is sent, yaml.dump overwrites config.yaml with invalid data before validation fails,
      permanently corrupting config.yaml on disk.
    reproduction_steps:
      - Send POST request to /api/backlog/save-weights with invalid payload.
      - Observe HTTP 500 error from Pydantic validation.
      - Inspect config.yaml to confirm corrupted data was written to disk.
    root_cause_hypothesis: >
      File write operation is performed prior to input validation rather than validating payload before disk write.

  - slug: subprocess-memory-unbounded-buffer
    title: Unbounded stdout buffering in proc.communicate() causes memory spike before 64KB truncation
    module: src/grimoire/actions/engine.py
    severity: medium
    status: open
    description: >
      _execute_action and _execute_global_action await proc.communicate(), which buffers all
      subprocess stdout and stderr bytes into RAM. If a script outputs hundreds of megabytes of text,
      Python allocates memory for the full output before applying 64KB truncation.
    reproduction_steps:
      - Create an action script outputting MBs of text.
      - Trigger the action and observe high memory consumption prior to 64KB truncation.
    root_cause_hypothesis: >
      Subprocess output stream is read entirely into memory via proc.communicate() before capping is applied.

  - slug: targeting-zombie-process-leak
    title: Zombie subprocess leak on script targeting timeout
    module: src/grimoire/targeting.py
    severity: medium
    status: fixed
    description: >
      When _script_matches times out after 30 seconds, proc.kill() is called to terminate the subprocess,
      but await proc.wait() is omitted, leaving zombie (defunct) processes in the OS process table.
    reproduction_steps:
      - Configure an action with a script target that runs sleep 60.
      - Execute resolve_targets and wait 30 seconds for timeout.
      - Inspect process table for defunct processes.
    root_cause_hypothesis: >
      _script_matches exception handler calls proc.kill() without awaiting proc.wait().

  - slug: actions-invalid-regex-crash
    title: Invalid regex in action definition crashes GET /actions/ endpoint
    module: src/grimoire/actions/router.py
    severity: medium
    status: fixed
    description: >
      list_actions() in router.py compiles action target regexes via re.compile(a.targets.regex)
      without exception handling. An action with an invalid regex string causes GET /actions/ to crash with HTTP 500.
    reproduction_steps:
      - Create an action YAML file with invalid regex targets.
      - Send GET /actions/ request.
      - Observe 500 Internal Server Error.
    root_cause_hypothesis: >
      list_actions compiles regex patterns on the fly without catching re.error.

  - slug: scheduler-eventloop-type-detection-bug
    title: register_actions improperly detects AsyncIOScheduler state leading to RuntimeError
    module: src/grimoire/actions/scheduler.py
    severity: medium
    status: fixed
    description: >
      register_actions checks hasattr(scheduler, "_eventloop") to distinguish AsyncIOScheduler from BackgroundScheduler.
      However, AsyncIOScheduler._eventloop is not set until scheduler.start() is called.
    reproduction_steps:
      - Instantiate AsyncIOScheduler() and call register_actions before scheduler.start().
      - Trigger a scheduled job.
      - Observe RuntimeError: This event loop is already running.
    root_cause_hypothesis: >
      register_actions inspects private attribute _eventloop instead of type checking via isinstance(scheduler, AsyncIOScheduler).

  - slug: checks-router-improper-session-exec
    title: Use of session.exec() with raw sqlalchemy.text() and keyword params in check results query
    module: src/grimoire/checks/router.py
    severity: medium
    status: fixed
    description: >
      In get_check_results(), the endpoint executes a raw SQL text() query using await session.exec(query, params={"slug": slug})
      suppressed with type ignores. session.exec() is typed for Select constructs; session.execute() is the correct method for raw SQL text().
    reproduction_steps:
      - Inspect src/grimoire/checks/router.py around line 158.
    root_cause_hypothesis: >
      session.exec() was used instead of session.execute() for raw SQL text() query execution.

  - slug: checks-router-concurrent-run-race-condition
    title: Endpoint check-running guard check occurs before background task registers execution state
    module: src/grimoire/checks/router.py
    severity: medium
    status: fixed
    description: >
      When POST /checks/{slug}/run is called, run_check_endpoint() checks is_check_running(slug) before queuing _run_in_background.
      However, _running_checks is only set inside run_check_for_all_targets when the background task executes later.
      Rapid POST requests trigger duplicate concurrent background tasks.
    reproduction_steps:
      - Send two rapid POST /checks/{slug}/run HTTP requests.
      - Both return HTTP 202 and spawn duplicate background tasks.
    root_cause_hypothesis: >
      Running state is registered inside the background task handler rather than synchronously within endpoint handler.

  - slug: github-client-paginated-304-data-truncation
    title: _paginated_get returns truncated result list when page > 1 encounters HTTP 304 Not Modified
    module: src/grimoire/github/client.py
    severity: medium
    status: open
    description: >
      In _paginated_get(), if page 1 returns HTTP 200 OK and a subsequent page returns HTTP 304, _paginated_get breaks and returns page 1 items only.
    reproduction_steps:
      - Request a paginated endpoint (>100 items). Page 1 returns 200, Page 2 returns 304.
      - Observe truncated result list.
    root_cause_hypothesis: >
      _paginated_get treats a 304 on page N > 1 as an end-of-pagination marker without page-level caching.

  - slug: repo-detail-check-output-layout-break
    title: Check output container inside repository.html breaks inline flex row layout when loaded
    module: src/grimoire/web/templates/repository.html
    severity: medium
    status: fixed
    description: >
