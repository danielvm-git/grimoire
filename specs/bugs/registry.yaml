  - slug: action-router-tests-leak-engines
    title: Action router tests leave aiosqlite engines open, producing 40+ "Event loop is closed" thread warnings per run
    module: tests/test_actions/test_router.py
    severity: low
    status: open
    found_in: e12 post-epic review (discovered defect)
    description: >
      Running the suite emits dozens of PytestUnhandledThreadExceptionWarning entries whose traceback
      is aiosqlite's _connection_worker_thread calling future.get_loop().call_soon_threadsafe on a
      closed loop, plus SAWarning "The engine provided as bind produced a connection that is already
      in a transaction". The engines created in the action router tests are never disposed, so their
      worker threads outlive the test's event loop. Preflight still passes, which is why it went
      unnoticed, but the noise masks real thread failures.
    reproduction_steps:
      - "uv run pytest tests/test_actions/test_router.py -q -W always::pytest.PytestUnhandledThreadExceptionWarning"
      - Observe one PytestUnhandledThreadExceptionWarning per leaked connection.
    root_cause_hypothesis: >
      The test fixtures build an engine but never await engine.dispose(), unlike the MCP tests which do.
    files_changed:
      - tests/test_actions/test_router.py
    approach: >
      Dispose the engine in the fixture teardown (or use a dispose-aware fixture) so no worker thread
      survives the loop.
    risk_level: low
    commit_message: "test(actions): dispose database engines in router tests"

