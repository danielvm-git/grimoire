  - slug: action-run-record-stuck-on-failure
    title: Action run DB record permanently stuck as "running" on exception
    module: src/grimoire/actions/engine.py
    severity: critical
    status: fixed
    description: >
      When run_action raises any exception, the finally block cleans up in-memory tracking but the
      DB ActionRunRecord is never updated from status "running" to a terminal state. This permanently
      blocks all future runs of that action with ActionConflictError.
    reproduction_steps:
      - Trigger an action that raises an exception (e.g., workspace error).
      - Observe the DB record stays as status "running".
      - Try to trigger the action again — ActionConflictError.
    root_cause_hypothesis: >
      Status update to "completed" is inside the try success path only; no except clause sets "failed".

  - slug: check-run-record-stuck-on-failure
    title: Check run DB record permanently stuck as "running" on exception
    module: src/grimoire/checks/engine.py
    severity: critical
    status: fixed
    description: >
      Same pattern as action engine. When run_check_for_all_targets raises, the CheckRunRecord
      stays as status "running" permanently.
    reproduction_steps:
      - Trigger a check that raises an exception during target resolution.
      - Observe the DB record stays as status "running".
    root_cause_hypothesis: >
      Status update to "completed" is inside the try success path only; no except clause sets "failed".

  - slug: pagination-race-paginated-vs-nonpaginated
    title: _last_next_link race between paginated and non-paginated requests causes silent data loss
    module: src/grimoire/github/client.py
    severity: high
    status: fixed
    description: >
      Non-paginated _request calls overwrite _last_next_link while a paginated call is in progress.
      This causes pagination to stop after page 1, silently dropping all remaining pages for repos
      with >100 items.
    reproduction_steps:
      - Configure repos with >100 open issues.
      - Trigger refresh which runs concurrent paginated and non-paginated requests.
      - Observe truncated issue/PR lists.
    root_cause_hypothesis: >
      _last_next_link is stored as instance state shared across all concurrent requests.

  - slug: stale-scheduler-repos-closure
    title: Scheduler jobs capture stale repos list via closure, missing newly added repos
    module: src/grimoire/app.py
    severity: high
    status: fixed
    description: >
      register_checks and register_actions capture the startup-time repos list. After refresh updates
      the list, scheduler closures still reference the original. Newly added repos are never checked
      by cron; removed repos are still checked.
    reproduction_steps:
      - Start Grimoire with repos A, B.
      - Add repo C to config and trigger refresh.
      - Wait for cron schedule — repo C is never checked.
    root_cause_hypothesis: >
      Scheduler closures capture the repos parameter by reference; the list is replaced
      (not mutated) during refresh.

  - slug: invalid-check-regex-crashes-dashboard
