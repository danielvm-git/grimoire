    module: src/grimoire/web/router.py
    severity: medium
    status: fixed
    description: >
      _resolve_targets_sync calls re.compile(targets.regex) without exception handling. An invalid
      regex in check YAML crashes all pages that build repo viewmodels.
    reproduction_steps:
      - Create a check YAML with invalid regex targets.
      - Load the dashboard.
      - 500 Internal Server Error.
    root_cause_hypothesis: >
      re.compile() on user-supplied regex is not wrapped in try/except.

  - slug: assert-in-endpoint-error-handling
