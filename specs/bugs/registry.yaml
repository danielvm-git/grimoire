  - slug: github-client-secondary-rate-limit-misclassification
    title: "HTTP 403 rate limit responses without X-RateLimit-Remaining: 0 header bypass RateLimitError"
    module: src/grimoire/github/client.py
    severity: low
    status: fixed
    description: >
      If GitHub sends a 403 secondary rate limit response without X-RateLimit-Remaining: 0, _request raises GitHubAPIError instead of RateLimitError.
    reproduction_steps:
      - Trigger secondary rate limit response without X-RateLimit-Remaining header.
    root_cause_hypothesis: >
      Rate limit classification strictly checks self._rate_limit_remaining == 0.

  - slug: deprecated-session-execute-usage
    title: Deprecated session.execute called on SQLModel AsyncSession across multiple web router queries
    module: src/grimoire/web/router.py
    severity: low
    status: open
    description: >
      Multiple call sites in router.py use await session.execute(...) instead of await session.exec(...), triggering deprecation warnings.
    reproduction_steps:
      - Trigger web routes querying database and inspect warning logs.
    root_cause_hypothesis: >
      Queries were written using standard SQLAlchemy session.execute() syntax rather than SQLModel's session.exec().

