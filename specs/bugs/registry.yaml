  # ── e12 post-epic review (2026-11-06) ──────────────────────────────────────
  - slug: mcp-auth-middleware-breaks-sse-stream
    title: MCPAuthMiddleware uses BaseHTTPMiddleware around the SSE stream, crashing the ASGI app on every client disconnect
    module: src/grimoire/mcp/server.py
    severity: high
    status: open
    found_in: e12 post-epic review
    description: >
      mount_mcp_server wraps the FastMCP SSE app in an inner FastAPI app whose only job is
      to attach MCPAuthMiddleware, which extends starlette BaseHTTPMiddleware. BaseHTTPMiddleware
      buffers the response and asserts that every downstream ASGI message is http.response.body
      (starlette/middleware/base.py:178). An SSE response is an endless stream, so when a client
      disconnects the inner app emits a fresh http.response.start and the assert fires:
      "AssertionError: Unexpected message: {'type': 'http.response.start', 'status': 200, ...}".
      MCP clients reconnect constantly, so this raises an unhandled ASGI exception and an ERROR
      log on every normal disconnect. It also defeats streaming, since the middleware accumulates
      the whole response before forwarding.
    reproduction_steps:
      - Run `GRIMOIRE_MCP_TOKEN=smoke-token-123 just run`.
      - "curl -s -o /dev/null --max-time 1 -H 'X-MCP-Token: smoke-token-123' http://127.0.0.1:8000/mcp/sse"
      - Observe `ERROR: Exception in ASGI application` plus the AssertionError traceback in the log, once per disconnect.
    root_cause_hypothesis: >
      Starlette's BaseHTTPMiddleware is documented as incompatible with streaming responses.
      The auth check only inspects request headers, so it does not need a response-wrapping
      middleware at all.
    files_changed:
      - src/grimoire/mcp/server.py
      - tests/test_mcp/test_server.py
    approach: >
      Replace BaseHTTPMiddleware with a pure ASGI middleware that returns a 401 response itself
      or forwards the untouched receive/send callables to the SSE app. Drop the inner FastAPI
      wrapper and mount the SSE app directly. Regression: an SSE request that disconnects must
      leave the app alive with no AssertionError.
    risk_level: medium
    commit_message: "fix(mcp): use pure ASGI auth middleware so SSE disconnects do not crash"

  - slug: check-backlog-ignores-branch
    title: get_check_backlog collapses per-branch results by slug, silently reporting all_passed when another branch is failing
    module: src/grimoire/checks/queries.py
    severity: high
    status: open
    found_in: e12 post-epic review
    description: >
      get_latest_check_results returns one row per (check_slug, repo_full_name, branch), because
      Grimoire runs checks on every tracked branch. get_check_backlog then builds
      `results_by_slug = {r.check_slug: r for r in latest_results}`, so only the last row per slug
      survives and the branch dimension is discarded. When a repo is tracked on several branches
      and the surviving row is the passing one, the tool reports all_passed=True while another
      branch is red. The payload also omits the branch field, so a caller cannot tell which branch
      a result came from.
    reproduction_steps:
      - Insert CheckResultRecord rows for acme/repo1 lint on branch "main" passed=False and branch "release" passed=True.
      - Call get_check_backlog(session, "acme/repo1", [lint]).
      - Observe all_passed=True, failing_checks=[], passing_checks=["release"] — the main failure vanished.
    root_cause_hypothesis: >
      The slug-only dict comprehension assumes a single branch per repo, but the query deliberately
      returns per-branch rows.
    files_changed:
      - src/grimoire/checks/queries.py
      - tests/test_checks/test_queries.py
    approach: >
      Aggregate by (slug, branch) instead of slug, report every failing branch, expose `branch` on
      each backlog entry, and add the branch dimension to the summary counts. Regression: a repo
      with a passing release branch and a failing main branch must report all_passed=False.
    risk_level: medium
    commit_message: "fix(checks): keep the branch dimension in the check backlog"

