name: Test Build Release Docs
# version: 4.1.0 — central reusable workflow invocation

on:
  push:
    branches: [main]
    paths:
      - "docs/user/**"
      - ".github/workflows/test-build-release-docs.yml"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/user/**"
      - ".github/workflows/test-build-release-docs.yml"
      - ".github/workflows/deploy-docs.yml"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-docs:
    uses: danielvm-git/.github/.github/workflows/test-build-release-pages-mkdocs.yml@main
    with:
      mkdocs_config: "docs/user/mkdocs.yml"
    secrets: inherit
