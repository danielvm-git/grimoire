name: Test Build Release
# version: 4.1.0 — central reusable workflow invocation

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/workflows/test-build-release-docs.yml"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/workflows/test-build-release-docs.yml"
      - ".github/workflows/deploy-docs.yml"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: danielvm-git/.github/.github/workflows/test-build-release-python.yml@main
    with:
      site_url: "https://grimoire.bigbase.click"
      type_checker: "pyright"
      release_tool: "semantic-release"
    secrets: inherit
