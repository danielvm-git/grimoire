name: Deploy Docs
# version: 4.1.0 — central reusable workflow invocation

on:
  workflow_run:
    workflows: ["Test Build Release Docs"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: deploy-github-pages
  cancel-in-progress: false

jobs:
  cd-docs:
    uses: danielvm-git/.github/.github/workflows/deploy-pages-mkdocs.yml@main
    secrets: inherit
