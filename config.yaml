# Grimoire Configuration
github:
  token: "${GITHUB_TOKEN}"

git:
  user:
    name: "Daniel"
    email: "danielvm-git@users.noreply.github.com"

repositories:
  # Dynamic discovery: every repo owned by this account is tracked, so new
  # repositories appear on the next refresh without editing this file.
  - user: "danielvm-git"
    exclude: []

staleness:
  pull_requests_days: 30
  issues_days: 365
  problematic_stale_issues_pct: 20
  problematic_stale_prs_pct: 20

refresh_schedule: "0 * * * *"

mcp:
  enabled: true
  token: "${GRIMOIRE_MCP_TOKEN:-}"
  endpoint_path: "/mcp"

# Paths: env overrides for the container (Kamal mounts the state volume);
# locally they fall back to the repo directory.
data_dir: "./data"
workspace_dir: "${GRIMOIRE_WORKSPACE:-./workspace}"
database_path: "${GRIMOIRE_DB_PATH:-./grimoire.db}"
log_file: "${GRIMOIRE_LOG_FILE:-./grimoire.log}"
