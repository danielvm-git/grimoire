version: 1
framework: python
build:
  command: uv sync --frozen
start:
  # Direct venv entrypoint: the platform's auto path runs `uv run`, which can
  # stall resolving the environment at startup and never bind the port.
  command: "./run.sh"
  port: 8000
health_check:
  path: /health
  expected_status: 200
  timeout_seconds: 30
  interval_seconds: 5
  max_retries: 36

