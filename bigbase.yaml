version: 1
framework: python
build:
  command: uv sync --frozen
start:
  # Direct venv entrypoint: the platform's auto path runs `uv run`.
  command: "sh run.sh"
  port: 8000
# If the runtime falls back to `uv run`, do not re-sync the environment: the
# build already created .venv, and syncing at startup can block before bind.
env:
  UV_NO_SYNC: "1"
health_check:
  path: /health
  expected_status: 200
  timeout_seconds: 30
  interval_seconds: 5
  max_retries: 36

