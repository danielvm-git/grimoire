name: "Lint Passes"
description: >
  Auto-detects project language and runs the appropriate linter.
  Supported: Python (ruff), Go (golangci-lint), JavaScript/TypeScript (eslint),
  Rust (cargo clippy), Swift (swiftlint), PHP (php -l), Shell (shellcheck).
  Falls back gracefully if the linter is not installed.
targets:
  regex: ".*"
severity: warning
script: |
  set -e
  run_lint() {
    local tool="$1" name="$2"
    shift 2
    if ! command -v "$tool" &>/dev/null; then

      echo "WARN: $name not installed, skipping"
      return 0
    fi
    echo "Running $name ..."
    "$@" || { echo "FAIL: $name reported errors"; return 1; }
    echo "PASS: $name clean"
  }

  rc=0

  if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
    run_lint ruff "ruff" ruff check . || rc=1
  fi

  if [ -f go.mod ]; then
    run_lint golangci-lint "golangci-lint" golangci-lint run ./... || rc=1
  fi

  if [ -f package.json ]; then
    if ! [ -d node_modules ] && command -v npm &>/dev/null; then
      echo "Installing node_modules ..."
      npm install --ignore-scripts --no-audit --no-fund 2>&1 || echo "WARN: npm install failed"
    fi
    if [ -d node_modules ]; then
      run_lint eslint "eslint" npx eslint . || rc=1
    else
      echo "WARN: node_modules not found, skipping eslint"
    fi
  fi

  if [ -f Cargo.toml ]; then
    run_lint cargo "cargo clippy" cargo clippy -- -D warnings || rc=1
  fi

  if [ -f Package.swift ]; then
    run_lint swiftlint "swiftlint" swiftlint lint --strict || rc=1
  fi

  if [ -f composer.json ]; then
    if command -v php &>/dev/null; then
      php_files="$(find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -not -path './node_modules/*' 2>/dev/null || true)"
      if [ -n "$php_files" ]; then
        run_lint php "php -l" sh -c 'for f in '"$php_files"'; do php -l "$f" || exit 1; done' || rc=1
      fi
    else
      echo "WARN: php not installed, skipping"
    fi
  fi

  # Fallback: shellcheck on .sh files
  if [ -z "$(ls pyproject.toml go.mod package.json Cargo.toml Package.swift composer.json 2>/dev/null)" ]; then
    sh_files="$(find . -name '*.sh' -not -path './.git/*' -not -path './node_modules/*' -not -path './vendor/*' 2>/dev/null || true)"
    if [ -n "$sh_files" ]; then
      run_lint shellcheck "shellcheck" shellcheck $sh_files || rc=1
    fi
  fi

  exit $rc
