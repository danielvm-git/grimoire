# P1 pattern from danielvm-git/.github — source: align-existing-repo.md §2 (P1), templates/readmes/
# Logic lives in src/grimoire/conformance/ (tested); see docs/user/reference/conformance.md.
name: "README follows template"
description: >
  README has a GitHub Actions badge and the Build status, Tech/framework used, Contribute and License sections every stack template shares.
targets:
  script: '[ "$BRANCH" = "$DEFAULT_BRANCH" ]'
schedule: "0 */6 * * *"
severity: warning
priority: P1
script: |
  "${GRIMOIRE_PYTHON:-python3}" -m grimoire.conformance readme-template
