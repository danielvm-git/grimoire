# P1 pattern from danielvm-git/.github — source: CONVENTIONS.md, scripts/check-conventional-commits.sh
# Logic lives in src/grimoire/conformance/ (tested); see docs/user/reference/conformance.md.
name: "Conventional Commits"
description: >
  The last 50 non-merge commits on the default branch use Conventional Commits subjects.
targets:
  script: '[ "$BRANCH" = "$DEFAULT_BRANCH" ]'
schedule: "0 */6 * * *"
severity: warning
priority: P1
script: |
  "${GRIMOIRE_PYTHON:-python3}" -m grimoire.conformance conventional-commits
