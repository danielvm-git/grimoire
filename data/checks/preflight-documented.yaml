# P1 pattern from danielvm-git/.github — source: align-existing-repo.md §6 (P1)
# Logic lives in src/grimoire/conformance/ (tested); see docs/user/reference/conformance.md.
name: "Preflight documented"
description: >
  README names the single preflight command (a Preflight row or section).
targets:
  script: '[ "$BRANCH" = "$DEFAULT_BRANCH" ]'
schedule: "0 */6 * * *"
severity: warning
priority: P1
script: |
  python3 -m grimoire.conformance preflight-documented
