name: "No Secrets"
description: >
  Scans for leaked credentials, tokens, and API keys using gitleaks.
  Skips gracefully if gitleaks is not installed.
schedule: "0 * * * *"
targets:
  regex: ".*"
severity: error
script: |
  set -e
  if ! command -v gitleaks &>/dev/null; then
    echo "gitleaks not installed, skipping"
    exit 0
  fi
  gitleaks detect --no-git --no-banner --source .
  echo "PASS: No secrets detected"

