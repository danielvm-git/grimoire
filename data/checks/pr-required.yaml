# P1 pattern from danielvm-git/.github — source: branch-protection-rules.md (P1)
# Logic lives in src/grimoire/conformance/ (tested); see docs/user/reference/conformance.md.
name: "Default branch protected"
description: >
  The default branch is protected. Solo-owner policy: direct push is allowed, so no pull request or approving review is required.
targets:
  script: '[ "$BRANCH" = "$DEFAULT_BRANCH" ]'
schedule: "0 */6 * * *"
severity: warning
priority: P1
script: |
  "${GRIMOIRE_PYTHON:-python3}" -m grimoire.conformance pr-required
