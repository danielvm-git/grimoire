# P1 pattern from danielvm-git/.github — source: branch-protection-rules.md (P1)
# Logic lives in src/grimoire/conformance/ (tested); see docs/user/reference/conformance.md.
name: "Pull request required"
description: >
  The default branch requires a pull request with at least one approving review.
targets:
  script: '[ "$BRANCH" = "$DEFAULT_BRANCH" ]'
schedule: "0 */6 * * *"
severity: warning
priority: P1
script: |
  python3 -m grimoire.conformance pr-required
