# P1 pattern from danielvm-git/.github — source: CONVENTIONS.md § Git Attribution (P1)
# Logic lives in src/grimoire/conformance/ (tested); see docs/user/reference/conformance.md.
name: "No Co-authored-by footers"
description: >
  None of the last 50 non-merge commits on the default branch carries a Co-authored-by footer.
targets:
  script: '[ "$BRANCH" = "$DEFAULT_BRANCH" ]'
schedule: "0 */6 * * *"
severity: warning
priority: P1
script: |
  python3 -m grimoire.conformance no-ai-coauthors
