name: "Lockfile up-to-date"
description: "Checks whether running uv lock would produce any changes to uv.lock files"
schedule: "0 * * * *"
targets:
  script: "find . -name 'uv.lock' -print -quit | grep -q ."
severity: error
script: |
  set -e
  if ! command -v uv &>/dev/null; then
    echo "WARN: uv not installed, skipping"
    exit 0
  fi
  unset UV_FROZEN
  for lockfile in $(find . -name 'uv.lock' -type f -not -path '*/.venv/*' -not -path '*/workspace/*'); do
    dir="$(dirname "$lockfile")"
    echo "Checking $lockfile ..."
    (cd "$dir" && uv lock --check) || {
      echo "FAIL: $lockfile is out of sync with pyproject.toml"
      exit 1
    }
  done
  echo "All lockfiles are up-to-date."

